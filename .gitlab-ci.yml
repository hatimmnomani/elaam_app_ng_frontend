image: node:14.16
cache:
  paths:
    - node_modules/
before_script:
  - apt-get update -qq && apt-get install
  - npm install -g @angular/cli@12.2.13
  - ng --version
  - npm --version
  - node --version
stages:
  - Coverage
  - Sonarcheck
  #- QA_Tag_Release
  #- Prod_Tag_Release
  - security_scan_snyk
  - security_scan_trivy
  - QABuild
  - QADeploy
  - ProdBuild
  - ProdDeploy

Coverage:
  stage: Coverage
  image: node:16-bullseye
  variables:
    GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project
    CHROME_BIN: /usr/bin/google-chrome
  before_script:
    - apt-get update && apt-get install -y wget gnupg
    - wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | apt-key add -
    - sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google.list'
    - apt-get update
    - apt-get install -y google-chrome-stable fonts-ipafont-gothic fonts-wqy-zenhei fonts-thai-tlwg fonts-kacst fonts-freefont-ttf libxss1 --no-install-recommends
  script:
    - npm install --save-dev jest -f
    - npm test -- --no-watch --no-progress --browsers=ChromeHeadless --code-coverage || true
    #- echo "Skipping tests"
  allow_failure: true
  artifacts:
    paths:
      - coverage/lcov.info
    expire_in: 1 week
  tags:
    - elaam-wapp
  only:
    - develop

Tools:
  stage: Sonarcheck
  image: 
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
    GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  before_script:
    - echo "Skipping global before_script for SonarQube"
  script: 
    - sonar-scanner -Dsonar.projectKey=$PROJECT_KEY -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN
  allow_failure: true
  only:
    - develop
  tags:
    - elaam-wapp

